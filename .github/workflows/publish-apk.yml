name: Publish sideload APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch APK
        run: |
          set -euo pipefail
          URL=$(tr -d '\n' < download-url.txt)
          curl -L --fail --retry 3 -A "curl/8 GitHubActions" -o liuguang-1.3.0.apk "$URL"
          test "$(stat -c%s liuguang-1.3.0.apk)" -gt 1000000
          ls -lh liuguang-1.3.0.apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.3.0 --yes || true
          gh release create v1.3.0 liuguang-1.3.0.apk \
            --title "流光 1.3.0 sideload" \
            --notes "Third-cut Android sideload APK (not on Play Store). package com.qizi.vod, version 1.3.0+5. kUseMock=false. kBaseUrl=https://lumen-cinema.vercel.app (no /api). Live demo catalog: GET /types, /vods, /home (sections list+items), /vods/:id mp4+hls. Tabs: 首页 / 发现 / 历史 / 我的. Empty state only when lists are empty."
