name: Publish sideload APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch APK
        run: |
          set -euo pipefail
          URL=$(tr -d '\n' < download-url.txt)
          curl -L --fail --retry 3 -A "curl/8 GitHubActions" -o liuguang-1.3.1.apk "$URL"
          test "$(stat -c%s liuguang-1.3.1.apk)" -gt 1000000
          ls -lh liuguang-1.3.1.apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.3.1 --yes || true
          gh release create v1.3.1 liuguang-1.3.1.apk \
            --title "流光 1.3.1 sideload" \
            --notes "Android sideload APK (not on Play Store). package com.qizi.vod, version 1.3.1+6. kUseMock=false. kBaseUrl=https://lumen-cinema.vercel.app (no /api). Covers: .svg via flutter_svg, .png/.jpg via CachedNetworkImage. Renders live BFF pic URLs; empty state only when lists are empty."
